              </div>

    });

    let currentSlide = 1;
    const totalSlides = 37;

    function populateSelect() {
      const select = document.getElementById('slideSelect');
      select.innerHTML = '';

        const opt = document.createElement('option');
        opt.value = s.num;
        opt.textContent = s.num + ". " + s.title;
        select.appendChild(opt);
      });
    }

    function renderSlide(num) {
      currentSlide = num;
      const s = SLIDES[num - 1];

      const card = document.getElementById('slideCard');
      card.innerHTML = `
        <div class="space-y-1">
          <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)]">
            <span class="font-semibold text-teal-600 dark:text-teal-400 uppercase tracking-wider">${s.sec}</span>
            <span class="font-mono">Slide ${s.num} / 37</span>
          </div>
          <h2 class="text-xl md:text-2xl font-bold text-[var(--foreground)]">${s.title}</h2>
          <p class="text-xs text-[var(--muted-foreground)]">${s.subtitle}</p>
        </div>

        <div class="my-4 flex-1">
          ${s.content}

          <span>CarePoint Hospital, Jaipur • Project B5 Report</span>
          <span>Confidential — Internal Strategy Deck</span>

      `;

      // Update UI elements
      document.getElementById('currentSlideNum').textContent = num;
      document.getElementById('slideSelect').value = num;
      document.getElementById('slideCategoryLabel').textContent = "• " + s.sec;
      document.getElementById('speakerNotesText').textContent = s.notes;
      document.getElementById('slideProgressBar').style.width = ((num / totalSlides) * 100) + '%';

      document.getElementById('btnPrev').disabled = (num === 1);
      document.getElementById('btnNext').disabled = (num === totalSlides);
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        renderSlide(currentSlide - 1);
      }
    }

    function goToSlide(num) {
      if (num >= 1 && num <= totalSlides) {
        renderSlide(num);
      }
    }

    function toggleNotes() {
      const panel = document.getElementById('speakerNotesPanel');
      panel.classList.toggle('hidden');
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    populateSelect();
    renderSlide(1);
